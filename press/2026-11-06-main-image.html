<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Runnersplac メイン画像</title>
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#121a26;color:#fff;font-family:"Inter","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;display:grid;grid-template-columns:1fr 470px}
.l{padding:64px 0 56px 72px;display:flex;flex-direction:column}
.tag{color:#ff6a3d;font-weight:800;letter-spacing:.12em;font-size:20px}
h1{margin:22px 0 0;font-size:54px;line-height:1.3;font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;color:#ff6a3d}
p{margin:22px 0 0;font-size:24px;color:#c9d1dc}
.brand{margin-top:auto;font-size:24px;font-weight:800}
.r{padding:72px 72px 56px 24px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.row span{display:block;font-size:20px;color:#9aa6b8;margin-bottom:8px}
.track{height:34px;background:#1f2938;border-radius:8px;position:relative}
.fill{height:100%;border-radius:8px;background:#7d8ba1}
.fill.hi{background:#ff6a3d}
.row b{position:absolute;right:12px;top:0;line-height:34px;font-size:20px}
.cap{font-size:17px;color:#9aa6b8}
</style>
</head>
<body>
<div class="l">
  <div class="tag">PRESS RELEASE</div>
  <h1>高いレースシューズほど<br><em>速いとは限らない。</em></h1>
  <p>105足を計測データで採点。<br>レース用は価格と性能点にほぼ相関なし</p>
  <div class="brand">Runnersplac</div>
</div>
<div class="r">
  <div class="cap">レース用21足の性能点（5点満点）</div>
  <div class="row"><span>価格の安い半分</span><div class="track"><div class="fill hi" style="width:75.8%"></div><b>3.79</b></div></div>
  <div class="row"><span>価格の高い半分</span><div class="track"><div class="fill" style="width:74.6%"></div><b>3.73</b></div></div>
  <div class="cap">価格と性能点の相関係数：-0.10</div>
</div>
</body>
</html>
